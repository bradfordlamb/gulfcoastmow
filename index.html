<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>We've Moved to Yard Steady</title>
<meta name="description" content="Gulf Coast Mow is now Yard Steady. You'll be redirected automatically.">
<link rel="canonical" href="https://yardsteady.com/">
<meta http-equiv="refresh" content="0; url=https://yardsteady.com/">
<meta name="robots" content="noindex, follow">
<style>
  :root { --green: #4db840; --dark: #0a0d07; --text: #dde3d7; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--dark);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .box { max-width: 420px; }
  h1 { font-size: 1.7rem; font-weight: 800; color: #fff; margin-bottom: 12px; }
  p { font-size: 1rem; color: rgba(255,255,255,0.7); margin-bottom: 24px; line-height: 1.6; }
  a.btn {
    display: inline-block;
    background: var(--green);
    color: #fff;
    text-decoration: none;
    font-weight: 700;
    padding: 14px 28px;
    border-radius: 10px;
    font-size: 1.05rem;
  }
  .spinner {
    width: 28px; height: 28px;
    border: 3px solid rgba(255,255,255,0.15);
    border-top-color: var(--green);
    border-radius: 50%;
    margin: 0 auto 20px;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
<script>
  window.location.replace("https://yardsteady.com/");
</script>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <h1>Gulf Coast Mow is now Yard Steady</h1>
    <p>Same reliable lawn care, new name. Redirecting you now — if nothing happens, click below.</p>
    <a class="btn" href="https://yardsteady.com/">Go to Yard Steady →</a>
  </div>
</body>
</html>
